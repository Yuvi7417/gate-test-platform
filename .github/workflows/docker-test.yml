name: Test Dockerfile

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: gate-test-platform:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify image was built
      run: docker image ls | grep gate-test-platform
    
    - name: Run container and verify startup
      run: |
        # Start container in background with name for easier tracking
        CONTAINER_ID=$(docker run -d -p 3000:3000 --name test-server gate-test-platform:test)
        echo "Container ID: $CONTAINER_ID"
        sleep 2
        
        # Check if container is running with more explicit check
        if docker inspect -f '{{.State.Running}}' test-server | grep -q true; then
          echo "✓ Container is running"
        else
          echo "✗ Container failed to start"
          docker logs test-server
          docker stop test-server 2>/dev/null || true
          docker rm test-server 2>/dev/null || true
          exit 1
        fi
        
        # Wait for server to be ready
        sleep 8
        
        # Test health endpoint with retries
        RETRY_COUNT=0
        MAX_RETRIES=10
        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          if curl -s -f -m 5 http://localhost:3000 > /dev/null 2>&1; then
            echo "✓ Server responded successfully on attempt $((RETRY_COUNT+1))"
            docker stop test-server
            docker rm test-server
            exit 0
          fi
          RETRY_COUNT=$((RETRY_COUNT+1))
          echo "Attempt $RETRY_COUNT/$MAX_RETRIES: Waiting for server..."
          sleep 2
        done
        
        echo "✗ Server failed to respond after $MAX_RETRIES attempts"
        docker logs test-server
        docker stop test-server 2>/dev/null || true
        docker rm test-server 2>/dev/null || true
        exit 1
    
    - name: Verify non-root user
      run: |
        CONTAINER_ID=$(docker run -d --name test-user gate-test-platform:test sleep 300)
        sleep 2
        
        # Check that container runs as non-root
        USER=$(docker exec test-user id -un)
        if [ "$USER" = "nodejs" ]; then
          echo "✓ Container running as nodejs (non-root)"
          docker stop test-user
          docker rm test-user
        else
          echo "✗ Container not running as nodejs user, got: $USER"
          docker stop test-user 2>/dev/null || true
          docker rm test-user 2>/dev/null || true
          exit 1
        fi
    
    - name: Verify image size
      run: |
        SIZE=$(docker image inspect gate-test-platform:test --format='{{.Size}}' | awk '{print $1/1024/1024 " MB"}')
        echo "Image size: $SIZE"
    
    - name: Cleanup
      if: always()
      run: |
        docker ps -aq | xargs -r docker stop
        docker ps -aq | xargs -r docker rm
